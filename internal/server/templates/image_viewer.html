{{define "image_viewer"}}<div class="image-viewer" data-image-viewer role="dialog" aria-modal="true" aria-label="Full-size image viewer" hidden><div class="image-viewer-stage" data-image-viewer-stage><img class="image-viewer-image" data-image-viewer-image alt=""></div><p class="image-viewer-error" role="alert">Unable to display this image.</p><button type="button" class="image-viewer-close" data-image-viewer-close aria-label="Close image viewer">&times;</button><div class="image-viewer-toolbar" aria-label="Image zoom controls"><button type="button" data-image-viewer-zoom-out aria-label="Zoom out">&minus;</button><output class="image-viewer-zoom-value" data-image-viewer-zoom-value aria-label="Current zoom">100%</output><button type="button" data-image-viewer-zoom-in aria-label="Zoom in">+</button><button type="button" data-image-viewer-actual-size aria-label="Show actual size">1:1</button><button type="button" data-image-viewer-fit aria-label="Fit image to screen">Fit</button></div></div>{{end}}
